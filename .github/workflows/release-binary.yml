name: Release binary

# Manual-only. Compiles muneem-setup.py + its four embedded modules to a
# single-file Nuitka binary on an Apple Silicon runner, then publishes the
# binary as a release on the public sudarshan-uc/muneem-release repo.
#
# Prereqs (one-time):
#   * Public repo `sudarshan-uc/muneem-release` must exist.
#   * This repo must have an Actions secret `RELEASE_REPO_TOKEN`: a
#     fine-grained PAT with `contents: write` on muneem-release only.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match __version__ in muneem-setup.py)"
        required: true
        default: "0.1.0"
      tag:
        description: "Git tag to create on this (private) repo and on the public release repo"
        required: true
        default: "v0.1.0"
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write   # for tagging this repo

jobs:
  build:
    name: Build & publish
    runs-on: macos-14   # Apple Silicon runner
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build toolchain
        run: |
          python -m pip install --upgrade pip
          pip install "nuitka==2.4.8" "ordered-set" "zstandard"

      - name: Verify __version__ matches input
        run: |
          python scripts/sanity_check.py
          V=$(python -c "import re,pathlib; m=re.search(r'^__version__\s*=\s*\"([^\"]+)', pathlib.Path('muneem-setup.py').read_text(), re.M); print(m.group(1) if m else '')")
          echo "muneem-setup.py __version__: $V"
          if [ "$V" != "${{ inputs.version }}" ]; then
            echo "::error::version mismatch ($V vs ${{ inputs.version }})"
            exit 1
          fi

      - name: Build release binary
        run: python scripts/build_release.py --version "${{ inputs.version }}"

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 muneem-installer > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Tag this (private) repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.tag }}" || echo "tag already exists"
          git push origin "${{ inputs.tag }}" || echo "tag already on remote"

      - name: Publish release to public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          PRE=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then PRE="--prerelease"; fi
          NOTES_FILE="RELEASE_NOTES.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "Muneem ${{ inputs.version }}" > "$NOTES_FILE"
          fi
          gh release create "${{ inputs.tag }}" \
            --repo sudarshan-uc/muneem-release \
            --title "Muneem ${{ inputs.version }}" \
            --notes-file "$NOTES_FILE" \
            $PRE \
            dist/muneem-installer \
            dist/SHA256SUMS.txt
