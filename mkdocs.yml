site_name: Muneem
site_description: Offline AI meeting notepad for macOS Apple Silicon.
site_url: https://sudarshan-uc.github.io/muneem/
repo_url: https://github.com/sudarshan-uc/muneem
repo_name: sudarshan-uc/muneem

docs_dir: docs
site_dir: site

# The canonical markdown files (INSTALL.md, USAGE.md, etc.) live at the
# repo root so they render on GitHub and can be opened by a user cloning
# the repo. The docs/ directory is assembled by the Docs workflow as
# symlinks to those root files before `mkdocs build` runs, which keeps
# one source of truth while satisfying mkdocs 1.6+'s requirement that
# docs_dir be a child of the config file.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Install: INSTALL.md
  - Usage: USAGE.md
  - Architecture: Build-Muneem.md
  - Local LLM Guide: Local-LLM-Setup-Guide.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
